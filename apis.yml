name: Astral Systems
description: >-
  Astral Systems is a fusion-technology company based in Bristol, United
  Kingdom, developing Multi-State Fusion (MSF) reactors that produce high-flux
  neutron sources on demand. Co-founded by Talmon Firestone (CEO) and Dr. Tom
  Wallace-Smith (CTO), the company applies compact, modular fusion to near-term
  problems: large-scale medical isotope production to address the global isotope
  shortage affecting cancer diagnosis and treatment, spent fission fuel
  analysis, neutronics research, industrial neutron irradiation and accelerated
  lifetime testing, materials-damage testing, nuclear-waste burnup, and hybrid
  fission/fusion power. It is a Speedinvest deep-tech portfolio company. Astral
  Systems is a hardware/deep-tech provider and does not currently publish a
  public API, developer portal, or machine-readable API specifications.
